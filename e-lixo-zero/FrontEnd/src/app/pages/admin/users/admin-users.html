<div class="page-title">
  <h1>Gerenciar Usuários</h1>
  <p>Visualize, ative ou desative contas de usuários.</p>
</div>

<div class="message success" *ngIf="message">{{ message }}</div>
<div class="message error" *ngIf="error">{{ error }}</div>

<div class="list">

  <div class="card user-card" *ngFor="let user of users">

    <div class="info">
      <h3>{{ user.fullName }}</h3>
      <p>{{ user.email }}</p>
      <p>{{ user.city }}<span *ngIf="user.neighborhood"> - {{ user.neighborhood }}</span></p>
      <p *ngIf="user.phone">{{ user.phone }}</p>
    </div>

    <div class="side">

      <div class="badges">
        <span class="badge type" [ngClass]="{ admin: user.userType === 'ADMIN' }">
          {{ typeLabel(user.userType) }}
        </span>
        <span class="badge" [ngClass]="user.active ? 'active' : 'inactive'">
          {{ user.active ? 'Ativo' : 'Inativo' }}
        </span>
      </div>

      <div class="actions" *ngIf="user.userType !== 'ADMIN'">
        <button type="button" class="btn-small secondary" (click)="toggleActive(user)">
          {{ user.active ? 'Desativar' : 'Ativar' }}
        </button>
        <button type="button" class="btn-small danger" (click)="remove(user)">
          Excluir
        </button>
      </div>

    </div>

  </div>

</div>
